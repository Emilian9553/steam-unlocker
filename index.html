<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamUnlocker - Key Einlösen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: white;
            overflow: hidden;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.8), 0 0 40px rgba(59, 130, 246, 0.4);
        }

        .btn-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(59, 130, 246, 1);
            transform: translateY(-2px);
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .pulsing-dot {
            animation: pulse-dot 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative px-4">

    <canvas id="particle-canvas"></canvas>

    <div class="w-full max-w-3xl flex flex-col items-center z-10">
        
        <div class="flex items-center gap-2 border border-blue-500/30 bg-blue-500/10 rounded-full px-4 py-1.5 mb-8">
            <div class="w-2 h-2 bg-blue-500 rounded-full pulsing-dot"></div>
            <span class="text-xs font-semibold text-blue-400 tracking-wider">SOFORTIGE AKTIVIERUNG</span>
        </div>

        <h1 class="text-5xl md:text-6xl font-extrabold text-center leading-tight mb-8">
            Gib deinen<br>
            <span class="text-blue-500 text-glow">SteamUnlocker Key</span> ein
        </h1>

        <div class="w-full border border-gray-800 bg-gray-900/60 backdrop-blur-sm rounded-xl p-4 text-center mb-6">
            <p class="text-gray-400 text-sm">Gib deinen <span class="text-blue-400 font-semibold">SteamUnlocker</span> Key ein, um den offiziellen Loader sofort herunterzuladen.</p>
        </div>

        <div class="w-full border border-gray-800 bg-gray-900/80 backdrop-blur-md rounded-2xl p-6 shadow-2xl relative">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                
                <div class="relative w-full flex-grow flex items-center bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 focus-within:border-blue-500 transition-colors">
                    <i class="fa-solid fa-key text-blue-500 mr-3"></i>
                    <input type="text" id="key-input" placeholder="Deinen SteamUnlocker Key eingeben" 
                           class="w-full bg-transparent border-none outline-none text-white placeholder-gray-600 font-mono">
                    
                    <button onclick="pasteKey()" class="text-xs font-bold text-gray-400 hover:text-white tracking-widest ml-2 transition-colors">
                        EINFÜGEN
                    </button>
                </div>

                <button onclick="redeemKey()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl flex items-center justify-center gap-2 btn-glow whitespace-nowrap">
                    EINLÖSEN <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div id="status-message" class="hidden mt-4 text-center text-sm font-semibold p-2 rounded-lg"></div>

            <p class="text-gray-500 text-xs mt-4">Füge deinen Key ein, um zu beginnen.</p>
        </div>

        <div class="mt-12 text-center space-y-3">
            <p class="text-gray-500 text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-halved text-blue-500/70"></i> 
                Dein Key wird sicher auf dem Server verifiziert.
            </p>
            <p class="text-gray-600 text-xs">
                Offizieller <span class="text-blue-500/70">SteamUnlocker</span> Download
            </p>
        </div>

    </div>

    <script>
        async function pasteKey() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('key-input').value = text;
            } catch (err) {
                const statusBox = document.getElementById('status-message');
                statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 block";
                statusBox.innerHTML = 'Bitte drücke <b>STRG + V</b> (oder auf dem Handy gedrückt halten), um den Key einzufügen.';
                setTimeout(() => { statusBox.classList.add('hidden'); }, 4000);
            }
        }

        async function redeemKey() {
            const key = document.getElementById('key-input').value.trim();
            const statusBox = document.getElementById('status-message');
            
            if(key === "") {
                statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 block";
                statusBox.innerText = "Bitte gib zuerst einen Key ein!";
                return;
            }

            statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-blue-500/20 text-blue-400 border border-blue-500/30 block";
            statusBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Key wird auf dem Server überprüft...';

            try {
                const serverUrl = 'https://steamunlocker-api.onrender.com/api/redeem';

                const response = await fetch(serverUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key: key })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = downloadUrl;
                    a.download = 'SteamUnlocker_Setup.exe'; 
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(downloadUrl);

                    statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-green-500/20 text-green-400 border border-green-500/30 block";
                    statusBox.innerHTML = '<i class="fa-solid fa-check"></i> Key bestätigt! Download startet...';
                } else {
                    const errorData = await response.json();
                    statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 block";
                    statusBox.innerHTML = '<i class="fa-solid fa-xmark"></i> ' + (errorData.message || "Ungültiger oder bereits benutzter Key!");
                }
            } catch (error) {
                statusBox.className = "mt-4 text-center text-sm font-semibold p-2 rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 block";
                statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Server-Fehler: Backend nicht erreichbar.';
            }
        }

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let numParticles = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            numParticles = window.innerWidth < 768 ? 40 : 80; 
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx = -this.vx;
                if (this.y < 0 || this.y > canvas.height) this.vy = -this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(59, 130, 246, 0.5)';
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(59, 130, 246, ${0.15 - distance / 800})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }

        resizeCanvas();
        animateParticles();
    </script>
</body>
</html>
